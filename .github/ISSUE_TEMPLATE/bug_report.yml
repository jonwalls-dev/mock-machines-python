name: Bug report
description: Something in the mock-machines package doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A short script and, if relevant, the scenario YAML.
      render: python
  - type: input
    id: version
    attributes:
      label: mock-machines version
      description: "Output of `python -c 'import mockmachines; print(mockmachines.__version__)'`"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux x86_64
        - Linux aarch64
        - macOS arm64
        - macOS x86_64
        - Windows x86_64
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
