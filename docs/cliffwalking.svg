  <rect x="40" y="80" width="600" height="200" fill="none" stroke="#6d675b" stroke-width="1.5"/>

  <!-- optimal route -->
  <path d="M65.0,255.0 L65.0,205.0 L615.0,205.0 L615.0,241.0" fill="none" stroke="#2f4b7c" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

  <!-- walker at the start cell -->
  <circle cx="65.0" cy="255.0" r="13" fill="#2f4b7c"/>
  <text x="65.0" y="259.0" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">W</text>
  <text x="65.0" y="298" font-size="11" fill="#2f4b7c" text-anchor="middle" font-weight="600">start</text>
  <text x="340" y="298" font-size="11" fill="#b8473b" text-anchor="middle" font-weight="600">cliff (cells 1–10)</text>
  <text x="615.0" y="298" font-size="11" fill="#2f7a4a" text-anchor="middle" font-weight="600">goal</text>

  <!-- sentinel -->
  <rect x="690" y="110" width="170" height="80" rx="6" fill="#e9e6df" stroke="#8a8374" stroke-dasharray="4 3"/>
  <text x="775" y="134" font-size="12" font-weight="600" fill="#444" text-anchor="middle">GridCell 48 · blocked</text>
  <text x="775" y="153" font-size="10.5" fill="#555" text-anchor="middle">every off-grid neighbour</text>
  <text x="775" y="168" font-size="10.5" fill="#555" text-anchor="middle">points here; the is_not blocked</text>
  <text x="775" y="181" font-size="10.5" fill="#555" text-anchor="middle">condition rejects the move</text>
  <path d="M642,150 L688,150" stroke="#8a8374" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-grey)"/>
  <text x="664" y="144" font-size="10" fill="#8a8374" text-anchor="middle">east</text>

  <!-- the step loop -->
  <text x="40" y="340" font-size="14" font-weight="600" fill="#222">One action = one turn</text>
  <rect x="40" y="356" width="250" height="92" rx="8" fill="#eef2f8" stroke="#2f4b7c"/>
  <text x="165" y="380" font-size="13" font-weight="600" fill="#2f4b7c" text-anchor="middle">Python (your code)</text>
  <text x="165" y="400" font-size="11" fill="#333" text-anchor="middle">policy picks move_north / south / east / west</text>
  <text x="165" y="417" font-size="11" fill="#333" text-anchor="middle">reward: −1 per step, −100 on a cliff</text>
  <text x="165" y="434" font-size="11" fill="#333" text-anchor="middle">cliff → back to start · goal → episode ends</text>

  <rect x="610" y="356" width="250" height="92" rx="8" fill="#f6f3ec" stroke="#6d675b"/>
  <text x="735" y="380" font-size="13" font-weight="600" fill="#444" text-anchor="middle">Mock Machines engine</text>
  <text x="735" y="400" font-size="11" fill="#333" text-anchor="middle">Walker stays put unless asked to move</text>
  <text x="735" y="417" font-size="11" fill="#333" text-anchor="middle">set_reference current_cell → neighbour</text>
  <text x="735" y="434" font-size="11" fill="#333" text-anchor="middle">steps += 1 · fully deterministic</text>

  <path d="M292,382 L608,382" stroke="#2f4b7c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="374" font-size="11.5" fill="#2f4b7c" text-anchor="middle" font-family="Menlo, Consolas, monospace">sim.step(target="Walker", event="move_east")</text>
  <path d="M608,424 L292,424" stroke="#6d675b" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <text x="450" y="416" font-size="11.5" fill="#555" text-anchor="middle" font-family="Menlo, Consolas, monospace">sim.observe("Walker") → pyarrow.Table</text>
</svg>
